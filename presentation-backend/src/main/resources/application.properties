# Importa as credenciais locais se o arquivo existir (gitignored — nunca vai ao GitHub)
spring.config.import=optional:application-local.properties

# ─── JPA / Hibernate ───────────────────────────────────────────
# "update" cria/atualiza tabelas sem apagar dados entre restarts
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ─── Servidor ──────────────────────────────────────────────────
server.port=8080

# As credenciais do banco ficam em application-local.properties (gitignored)
# Copie o arquivo application-local.properties.example e renomeie para
# application-local.properties, preenchendo com os dados reais do grupo.
